# vim:ft=kitty
## name: Oxocarbon Dark (base16 port, inspired by nyoom-engineering/oxocarbon.nvim)

# Background / Foreground
background              #0d0d0d
foreground              #f2f4f8

# Normal / ANSI colors 0-7
# base00 - deepest black / bg
color0  #0d0d0d
# base08 - red / vibrant magenta-pink
color1  #ee5396
# base0B - green
color2  #42be65
# base0A - yellow / soft orange
color3  #ffab91
# base0D - blue (primary accent)
color4  #78a9ff
# base0E - magenta
color5  #ff7eb6
# base0C - cyan
color6  #82cfff
# base05 - light gray / white-ish
color7  #dde1e6

# Bright / ANSI colors 8-15
# base01 - bright black / dark gray
color8  #262626
# bright red (same intensity)
color9  #ee5396
# bright green
color10 #42be65
# bright yellow
color11 #ffab91
# bright blue
color12 #78a9ff
# bright magenta
color13 #ff7eb6
# bright cyan
color14 #82cfff
# base07-ish - bright white
color15 #f2f4f8

# Cursor
cursor                  #f2f4f8
cursor_text_color       #161616

# Selection
# base02 - subtle mid-gray
selection_background    #393939
selection_foreground    #f2f4f8

# URL / hyperlinks
# matches primary blue
url_color               #78a9ff

# Tab bar (blends nicely)
active_tab_background   #393939
active_tab_foreground   #f2f4f8
inactive_tab_background #262626
inactive_tab_foreground #dde1e6

# Optional: dim opacity for inactive text if you like subtle fade
# inactive_text_opacity   0.95
