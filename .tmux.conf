# =============================================================================
# ~/.tmux.conf — standalone config (no oh-my-tmux)
# Oxycarbon theme + iarchean-style status bar
# =============================================================================

# -- general -------------------------------------------------------------------
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 5000

# -- prefix --------------------------------------------------------------------
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# -- display -------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#h ○ #S | #I #W"
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 5
set -g status-position top
set -g status-justify centre
set -g status 2
set -g status-format[1] " "
setw -g automatic-rename on
setw -g monitor-activity on
set -g visual-activity off

# -- mouse ---------------------------------------------------------------------
set -g mouse on

# -- pane borders --------------------------------------------------------------
set -g pane-border-style "fg=#1c1c1c"
set -g pane-active-border-style "fg=#60cfe8"
set -g display-panes-colour "#60cfe8"
set -g display-panes-active-colour "#60cfe8"

# -- message style -------------------------------------------------------------
set -g message-style "fg=#1c1c1c,bg=#f1ff52,bold"
set -g message-command-style "fg=#f1ff52,bg=#1c1c1c,bold"

# -- copy mode style -----------------------------------------------------------
setw -g mode-style "fg=#1c1c1c,bg=#f1ff52,bold"

# -- clock ---------------------------------------------------------------------
setw -g clock-mode-colour "#60cfe8"
setw -g clock-mode-style 24

# -- status line ---------------------------------------------------------------
set -g status-style "fg=#555555,bg=default,none"

# status left: [pink: arch+date] > [cyan: clock] > [gray: volume]
set -g status-left-length 1000
set -g status-left "#[fg=#1c1c1c,bg=#ee4f84,bold]   #(date '+%b %d %Y') #[fg=#ee4f84,bg=#60cfe8,none]#[fg=#1c1c1c,bg=#60cfe8,none]   #(date '+%H:%M') #[fg=#60cfe8,bg=#555555,none]#[fg=#d0d0d0,bg=#555555,none]  #(/home/Pilgrim/.local/bin/tmux-vol) #[fg=#555555,bg=default,none]"

# status right: [default: git/docker] > [green: memory] > [cyan: starship] > [pink: prefix]
set -g status-right-length 1000
set -g status-right "#[fg=#3a3a3a,bg=default,none]#[fg=#d0d0d0,bg=#3a3a3a,none] #('#{@starship_cmd}' git_branch )#('#{@starship_cmd}' git_status )#(cd #{pane_current_path} && git rev-parse --is-inside-work-tree >/dev/null 2>&1 || docker ps -q 2>/dev/null | wc -l | xargs -I# printf '  #') #[fg=#60cfe8,bg=#3a3a3a,none]#[fg=#1c1c1c,bg=#60cfe8,none]  #(/home/Pilgrim/.local/bin/tmux-mem) #[fg=#ee4f84,bg=#60cfe8,none]#[fg=#1c1c1c,bg=#ee4f84,bold] #{?client_prefix,󰒆,󰒅} #[fg=default,bg=#ee4f84,none]"

# -- window status -------------------------------------------------------------
setw -g window-status-style "fg=default,bg=default,none"
setw -g window-status-current-style "fg=default,bg=default,bold"
setw -g window-status-last-style "fg=default,bg=default,none"
setw -g window-status-activity-style "fg=default,bg=default,bold"
setw -g window-status-bell-style "fg=default,bg=default,blink,bold"
setw -g window-status-separator ""

setw -g window-status-format "#[fg=#232323,bg=#d0d0d0] #I #[fg=#d0d0d0,bg=#1c1c1c] #{?#{==:#{pane_current_command},ssh}, #{hostname},#{pane_current_command}}#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,󰨤,} "
setw -g window-status-current-format "#[fg=#232323,bg=#60cfe8] #I #[fg=#d0d0d0,bg=#3a3a3a] #{?#{==:#{pane_current_command},ssh}, #{hostname},#{pane_current_command}}#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,,}#{?window_zoomed_flag,󰨤,} "

# -- navigation ----------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf reloaded"
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# -- copy mode -----------------------------------------------------------------
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

if -b 'command -v xclip > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | wl-copy"'

# -- buffers -------------------------------------------------------------------
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# -- popups --------------------------------------------------------------------
bind g display-popup -w 90% -h 90% -E -d "#{pane_current_path}" "lazygit"
bind e new-window -c "#{pane_current_path}" "/bin/zsh -i -c 'sleep 0.2 && yazi'"
bind D display-popup -w 90% -h 90% -E "lazydocker"

# -- volume via mousewheel on status bar ---------------------------------------
bind -n WheelUpStatus run-shell "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
bind -n WheelDownStatus run-shell "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"

# -- kitty passthrough (yazi image previews) -----------------------------------
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment KITTY_LISTEN_ON

# -- TPM -----------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'iarchean/tmux-starship'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

run '~/.tmux/plugins/tpm/tpm'
